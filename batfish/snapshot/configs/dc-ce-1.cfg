! Cisco IOS-XE CE Router Configuration
! Generated from spec — do not edit manually
!
hostname dc-ce-1
!
interface Loopback0
 description Router ID
 ip address 172.16.0.101 255.255.255.255
!
interface GigabitEthernet1
 description to sp-pe-1
 ip address 172.16.0.0 255.255.255.254
 no shutdown
!
interface GigabitEthernet2
 description to dc-fw-1
 ip address 10.99.1.1 255.255.255.254
 no shutdown
!
interface GigabitEthernet3
 description to dc-fw-2
 ip address 10.99.1.3 255.255.255.254
 no shutdown
!
interface GigabitEthernet4
 description to sp-pe-2
 ip address 172.16.0.2 255.255.255.254
 no shutdown
!
ip routing
!
! Dual-homed path selection: prefer primary PE via local-preference
route-map PRIMARY-PE permit 10
 set local-preference 200
!
route-map SECONDARY-PE permit 10
 set local-preference 100
!
! Inbound TE: prepend our AS twice on egress to the secondary PE so anyone
! selecting on AS-path length downstream prefers the primary path. (Within
! the SP's iBGP mesh this is masked by best-path picking the shorter
! relayed copy — see tests/integration/test_dr_ce1_aspath_prepend.py for
! the full caveat.)
route-map LONG-PATH-OUT permit 10
 set as-path prepend 65100 65100
!
router bgp 65100
 bgp router-id 172.16.0.101
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 !
 neighbor 172.16.0.1 remote-as 64500
 neighbor 172.16.0.1 description sp-pe-1 (primary)
 neighbor 172.16.0.3 remote-as 64500
 neighbor 172.16.0.3 description sp-pe-2 (secondary)
 !
 address-family ipv4
  neighbor 172.16.0.1 activate
  neighbor 172.16.0.1 route-map PRIMARY-PE in
  neighbor 172.16.0.3 activate
  neighbor 172.16.0.3 route-map SECONDARY-PE in
  neighbor 172.16.0.3 route-map LONG-PATH-OUT out
  network 172.16.0.101 mask 255.255.255.255
  network 10.99.1.1 mask 255.255.255.254
  network 10.99.1.3 mask 255.255.255.254
 exit-address-family
!
interface GigabitEthernet5
 description Management
 ip address 192.168.68.120 255.255.252.0
 no shutdown
!
end
