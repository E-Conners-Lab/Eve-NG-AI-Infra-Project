### FortiGate HA Configuration
### Generated from spec — do not edit manually
###
config system global
    set hostname "dr-fw-2"
end

config system ha
    set mode a-p
    set group-id 2
    set group-name "dr-ha-cluster"
    set priority 150
    set hbdev "port3" 50
    set session-pickup enable
    set override disable
    set ha-mgmt-status enable
    config ha-mgmt-interfaces
        edit 1
            set interface "port6"
            set gateway 192.168.68.1
        next
    end
end

config system interface
    edit "port1"
        set mode static
        set ip 10.99.0.7 255.255.255.254
        set allowaccess ping https ssh
        set description "to dr-leaf-2"
    next
end

config system interface
    edit "port2"
        set mode static
        set ip 10.99.1.6 255.255.255.254
        set allowaccess ping https ssh
        set description "to dr-ce-1"
    next
end

### port3 reserved for HA heartbeat (configured via system ha hbdev)
config system interface
    edit "port6"
        set mode static
        set ip 192.168.68.128 255.255.252.0
        set allowaccess ping https ssh
        set description "Management"
    next
end

config system zone
    edit "dr-trust"
        set intrazone allow
        set description "trust zone"
        set interface "port1"
    next
end

config system zone
    edit "dr-untrust"
        set intrazone allow
        set description "untrust zone"
        set interface "port2"
    next
end

config firewall policy
    edit 1
        set name "allow-dr-outbound"
        set srcintf "dr-trust"
        set dstintf "dr-untrust"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set service "HTTPS" "HTTP" "ALL_ICMP"
        set schedule "always"
        set logtraffic all
    next
end

