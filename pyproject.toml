[project]
name = "ai-infra-lab"
version = "0.1.0"
description = "Spec-driven AI infrastructure lab — EVE-NG + NetBox + NetClaw agent"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21.0",
    "PyYAML>=6.0.1",
    "Jinja2>=3.1.3",
    "netmiko>=4.3.0",
    # boto3 is required by scripts/push_configs._inject_aws_psk to fetch the
    # AWS VPN PSK from Secrets Manager at push time. Module-level import in
    # push_configs.py means dropping this dep would break ALL device pushes,
    # not just the IPsec path — see tests/unit/test_push_configs_imports.py.
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "pynetbox>=7.3.0",
    "requests>=2.31.0",
    "fastmcp>=0.2.0",
    "pybatfish>=2024.1.10",
    "pandas>=2.0.0",
    "ntc-templates>=4.0.0",
]
generator = [
    "pynetbox>=7.3.0",
]
automation = [
    "nornir>=3.4.0",
    "nornir-utils>=0.2.0",
    "nornir-netmiko>=1.0.1",
    "pyats[library]>=24.10",
]

[tool.pytest.ini_options]
testpaths = ["tests", "generator/tests"]
pythonpath = ["."]
markers = [
    "integration: requires live EVE-NG/NetBox/Batfish infrastructure",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["generator*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures embed real BGP summary output that exceeds line length on purpose.
"tests/unit/test_diagnose_lab.py" = ["E501"]
"tests/unit/test_skills.py" = ["E501"]
