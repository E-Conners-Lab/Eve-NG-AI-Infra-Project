name: eve-ng-netbox

services:
  netbox: &netbox
    build:
      context: .
      dockerfile: Dockerfile-Plugins
    container_name: eve-ng-netbox
    image: eve-ng-netbox:v4.5
    depends_on:
      - postgres
      - redis
      - redis-cache
    env_file:
      - env/netbox.env
      - env/postgres.env
      - env/redis.env
    ports:
      - "8002:8080"
    user: "999:0"
    volumes:
      - ./configuration:/etc/netbox/config:z,ro
      - netbox-media-files:/opt/netbox/netbox/media:z
      - netbox-reports-files:/opt/netbox/netbox/reports:z
      - netbox-scripts-files:/opt/netbox/netbox/scripts:z
    healthcheck:
      test: curl -f http://localhost:8080/api/ || exit 1
      start_period: 90s
      timeout: 3s
      interval: 15s

  netbox-worker:
    <<: *netbox
    container_name: eve-ng-netbox-worker
    depends_on:
      netbox:
        condition: service_healthy
    ports: []
    healthcheck:
      test: ps -aux | grep -v grep | grep -q rqworker || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker

  netbox-housekeeping:
    <<: *netbox
    container_name: eve-ng-netbox-housekeeping
    depends_on:
      netbox:
        condition: service_healthy
    ports: []
    healthcheck:
      test: ps -aux | grep -v grep | grep -q housekeeping || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
    command:
      - /opt/netbox/housekeeping.sh

  postgres:
    image: postgres:16-alpine
    container_name: eve-ng-netbox-postgres
    env_file: env/postgres.env
    volumes:
      - netbox-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: eve-ng-netbox-redis
    command:
      - sh
      - -c
      - redis-server --appendonly yes --requirepass $$REDIS_PASSWORD
    env_file: env/redis.env
    volumes:
      - netbox-redis-data:/data

  redis-cache:
    image: redis:7-alpine
    container_name: eve-ng-netbox-redis-cache
    command:
      - sh
      - -c
      - redis-server --requirepass $$REDIS_PASSWORD
    env_file: env/redis.env

volumes:
  netbox-media-files:
  netbox-reports-files:
  netbox-scripts-files:
  netbox-postgres-data:
  netbox-redis-data:
