# Lab Bootstrap Configuration
# Single source of truth for data that bootstraps NetBox and EVE-NG.
# Both populate_netbox_contexts.py and create_topology.py read from this file.
# If you change an IP, ASN, or image name — change it HERE, nowhere else.

# Management network assignments (out-of-band, Cloud0/pnet0)
management:
  network: "192.168.68.0/22"
  gateway: "192.168.68.1"
  devices:
    dc-spine-1: "192.168.68.110"
    dc-spine-2: "192.168.68.111"
    dc-leaf-1: "192.168.68.112"
    dc-leaf-2: "192.168.68.113"
    dc-border-1: "192.168.68.114"
    dc-border-2: "192.168.68.115"
    dc-host-1: "192.168.68.116"
    dc-host-2: "192.168.68.117"
    dc-fw-1: "192.168.68.118"
    dc-fw-2: "192.168.68.119"
    dc-ce-1: "192.168.68.120"
    sp-pe-1: "192.168.68.121"
    sp-pe-2: "192.168.68.122"
    br-ce-1: "192.168.68.123"
    br-host-1: "192.168.68.124"
    dr-leaf-1: "192.168.68.125"
    dr-leaf-2: "192.168.68.126"
    dr-fw-1: "192.168.68.127"
    dr-fw-2: "192.168.68.128"
    dr-ce-1: "192.168.68.129"
    dr-host-1: "192.168.68.130"

# EVE-NG platform mappings (template name, image folder, resource requirements)
eve_ng_platforms:
  arista_eos:
    template: "veos"
    image: "veos-4.33.1.1F"
    ram: 2048
    cpu: 1
    ethernet: 8
  cisco_iosxe:
    template: "c8000v"
    image: "c8000v-17.13.01a"
    ram: 8192
    cpu: 4
    ethernet: 5
  fortinet_fortios:
    template: "fortinet"
    image: "fortinet-FGT"
    ram: 2048
    cpu: 1
    ethernet: 6
  linux:
    template: "linux"
    image: "linux-alpine"
    ram: 512
    cpu: 1
    ethernet: 2

# EVE-NG interface label mapping (spec name → EVE-NG short label)
eve_ng_mgmt_labels:
  arista_eos: "Mgmt1"
  cisco_iosxe: "Gi5"
  fortinet_fortios: "port6"
  linux: "e1"

# EVE-NG canvas layout positions (left, top)
eve_ng_layout:
  dc-spine-1: [300, 50]
  dc-spine-2: [500, 50]
  dc-leaf-1: [200, 200]
  dc-leaf-2: [400, 200]
  dc-border-1: [600, 200]
  dc-border-2: [800, 200]
  dc-host-1: [200, 350]
  dc-host-2: [400, 350]
  dc-fw-1: [600, 350]
  dc-fw-2: [800, 350]
  dc-ce-1: [700, 500]
  sp-pe-1: [500, 650]
  sp-pe-2: [900, 650]
  br-ce-1: [300, 800]
  br-host-1: [300, 950]
  dr-leaf-1: [1100, 200]
  dr-leaf-2: [1300, 200]
  dr-fw-1: [1100, 350]
  dr-fw-2: [1300, 350]
  dr-ce-1: [1200, 500]
  dr-host-1: [1200, 800]

# Shared overlay ASN for cross-site EVPN route-target interoperability
shared_overlay_asn: 65000
