### FortiGate HA Configuration
### Generated from spec — do not edit manually
###
config system global
    set hostname "dc-fw-1"
end

config system ha
    set mode a-p
    set group-id 1
    set group-name "dc-ha-cluster"
    set priority 200
    set hbdev "port3" 50
    set session-pickup enable
    set override disable
    set ha-mgmt-status enable
    config ha-mgmt-interfaces
        edit 1
            set interface "port6"
            set gateway 192.168.68.1
        next
    end
end

config system interface
    edit "port1"
        set mode static
        set ip 10.99.0.1 255.255.255.254
        set allowaccess ping https ssh
        set description "to dc-border-1"
    next
end

config system interface
    edit "port2"
        set mode static
        set ip 10.99.1.0 255.255.255.254
        set allowaccess ping https ssh
        set description "to dc-ce-1"
    next
end

config system interface
    edit "port6"
        set mode static
        set ip 192.168.68.118 255.255.252.0
        set allowaccess ping https ssh
        set description "Management"
    next
end

config system zone
    edit "dc-trust"
        set intrazone allow
        set description "trust zone"
        set interface "port1"
    next
end

config system zone
    edit "wan-untrust"
        set intrazone allow
        set description "untrust zone"
        set interface "port2"
    next
end

config firewall policy
    edit 1
        set name "allow-dc-outbound"
        set srcintf "dc-trust"
        set dstintf "wan-untrust"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set service "HTTPS" "HTTP" "ALL_ICMP"
        set schedule "always"
        set logtraffic all
    next
end

config firewall policy
