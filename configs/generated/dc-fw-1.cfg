### FortiGate HA Configuration
### Generated from spec — do not edit manually
###
config system global
    set hostname "dc-fw-1"
end

config system interface
    edit "port1"
        set ip 10.99.0.1 255.255.255.254
        set allowaccess ping https ssh
        set description "to dc-border-1"
        set zone "dc-trust"
    next
end

config system interface
    edit "port2"
        set ip 10.99.1.0 255.255.255.254
        set allowaccess ping https ssh
        set description "to dc-ce-1"
        set zone "wan-untrust"
    next
end

config system interface
    edit "port3"
        set allowaccess ping https ssh
        set description "HA heartbeat"
    next
end

config system ha
    set mode a-p
    set group-id 1
    set group-name "dc-ha-cluster"
    set priority 200
    set hbdev "port3" 50
    set session-pickup enable
    set override disable
end

config system zone
    edit "dc-trust"
        set intrazone allow
        set description "trust zone"
    next
end

config system zone
    edit "wan-untrust"
        set intrazone allow
        set description "untrust zone"
    next
end

config firewall policy
    edit 1
        set name "allow-dc-outbound"
        set srcintf "dc-trust"
        set dstintf "wan-untrust"
        set srcaddr "all"
        set dstaddr "all"
        set action allow
        set service "tcp/443" "tcp/80" "icmp"
        set schedule "always"
        set logtraffic all
    next
end

config firewall policy
    edit 2
        set name "allow-dc-ssh"
        set srcintf "dc-trust"
        set dstintf "wan-untrust"
        set srcaddr "all"
        set dstaddr "all"
        set action allow
        set service "tcp/22"
        set schedule "always"
        set logtraffic all
    next
end

end
