security:
  dc:
    firewalls:
    - name: dc-fw-1
      role: firewall
      platform: fortinet_fortios
      interfaces:
      - name: port1
        ipv4: 10.99.0.1/31
        description: to dc-border-1
        peer: dc-border-1
        peer_interface: Ethernet3
      - name: port2
        ipv4: 10.99.1.0/31
        description: to dc-ce-1
        peer: dc-ce-1
        peer_interface: GigabitEthernet2
    - name: dc-fw-2
      role: firewall
      platform: fortinet_fortios
      interfaces:
      - name: port1
        ipv4: 10.99.0.3/31
        description: to dc-border-2
        peer: dc-border-2
        peer_interface: Ethernet3
      - name: port2
        ipv4: 10.99.1.2/31
        description: to dc-ce-1
        peer: dc-ce-1
        peer_interface: GigabitEthernet3
    zones:
    - name: dc-trust
      type: trust
      interfaces:
      - port1
    - name: wan-untrust
      type: untrust
      interfaces:
      - port2
    policies:
    - name: allow-dc-outbound
      action: allow
      services:
      - tcp/443
      - tcp/80
      - icmp
      source_zone: dc-trust
      destination_zone: wan-untrust
    - name: allow-dc-ssh
      action: allow
      services:
      - tcp/22
      source_zone: dc-trust
      destination_zone: wan-untrust
  dr:
    firewalls:
    - name: dr-fw-1
      role: firewall
      platform: fortinet_fortios
      interfaces:
      - name: port1
        ipv4: 10.99.0.5/31
        description: to dr-leaf-1
        peer: dr-leaf-1
        peer_interface: Ethernet2
      - name: port2
        ipv4: 10.99.1.4/31
        description: to dr-ce-1
        peer: dr-ce-1
        peer_interface: GigabitEthernet2
    - name: dr-fw-2
      role: firewall
