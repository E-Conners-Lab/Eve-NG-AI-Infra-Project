      action: allow
      services:
      - tcp/443
      - tcp/80
      - icmp
      source_zone: dr-trust
      destination_zone: dr-untrust
agent:
  boundary:
    managed:
    - br-ce-1
    - dc-border-1
    - dc-border-2
    - dc-leaf-1
    - dc-leaf-2
    - dc-spine-1
    - dc-spine-2
    - dr-leaf-1
    - dr-leaf-2
    observed:
    - dc-border-1:Ethernet3
    - dc-border-2:Ethernet3
    - dr-leaf-1:Ethernet2
    - dr-leaf-2:Ethernet2
    excluded:
    - dc-ce-1
    - dc-fw-1
    - dc-fw-2
    - dr-ce-1
    - dr-fw-1
    - dr-fw-2
    - sp-pe-1
    - sp-pe-2
  thresholds:
    bgp_hold_time: 180
    max_route_deviation_pct: 10.0
    interface_flap_window_sec: 300
  compliance_rules:
  - name: bgp-session-established
    check: all managed BGP sessions must be in Established state
    severity: critical
  - name: vtep-reachability
    check: all VTEP loopbacks must be reachable from all other VTEPs
    severity: critical
  - name: vni-consistency
    check: VNI-to-VLAN mappings must match across all sites
    severity: warning
tests:
  reachability_matrix:
  - source: br-host-1
    destination: dc-host-1
    description: 'Branch to DC: br-host-1 to dc-host-1'
  - source: br-host-1
    destination: dc-host-2
    description: 'Branch to DC: br-host-1 to dc-host-2'
  - source: br-host-1
    destination: dr-host-1
    description: 'Branch to DR: br-host-1 to dr-host-1'
  - source: dc-host-1
    destination: dc-host-2
    description: 'Intra-site DC: dc-host-1 to dc-host-2'
  - source: dc-host-1
    destination: dr-host-1
    description: 'DC to DR: dc-host-1 to dr-host-1'
  - source: dc-host-2
    destination: dr-host-1
    description: 'DC to DR: dc-host-2 to dr-host-1'
