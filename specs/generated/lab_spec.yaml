security:
  dc:
    firewalls:
      - name: dc-fw-1
        role: firewall
        platform: fortinet_fortios
        interfaces:
          - name: port1
            ipv4: "10.99.0.1/31"
            description: "to dc-border-1"
            peer: dc-border-1
            peer_interface: Ethernet3
          - name: port2
            ipv4: "10.99.1.0/31"
            description: "to dc-ce-1"
            peer: dc-ce-1
            peer_interface: GigabitEthernet2
          - name: port3
            description: "HA heartbeat"
      - name: dc-fw-2
        role: firewall
        platform: fortinet_fortios
        interfaces:
          - name: port1
            ipv4: "10.99.0.3/31"
            description: "to dc-border-2"
            peer: dc-border-2
            peer_interface: Ethernet3
          - name: port2
            ipv4: "10.99.1.2/31"
            description: "to dc-ce-1"
            peer: dc-ce-1
            peer_interface: GigabitEthernet3
          - name: port3
            description: "HA heartbeat"
    zones:
      - name: dc-trust
        type: trust
        interfaces:
          - port1
      - name: wan-untrust
        type: untrust
        interfaces:
          - port2
    policies:
      - name: allow-dc-outbound
        source_zone: dc-trust
        destination_zone: wan-untrust
        action: allow
        services:
          - tcp/443
          - tcp/80
          - icmp
      - name: allow-dc-ssh
        source_zone: dc-trust
        destination_zone: wan-untrust
        action: allow
        services:
          - tcp/22
  dr:
    firewalls:
      - name: dr-fw-1
        role: firewall
        platform: fortinet_fortios
        interfaces:
          - name: port1
            ipv4: "10.99.0.5/31"
            description: "to dr-leaf-1"
            peer: dr-leaf-1
            peer_interface: Ethernet2
          - name: port2
            ipv4: "10.99.1.4/31"
            description: "to dr-ce-1"
            peer: dr-ce-1
            peer_interface: GigabitEthernet2
          - name: port3
            description: "HA heartbeat"
      - name: dr-fw-2
        role: firewall
        platform: fortinet_fortios
        interfaces:
          - name: port1
            ipv4: "10.99.0.7/31"
            description: "to dr-leaf-2"
            peer: dr-leaf-2
            peer_interface: Ethernet2
          - name: port2
            ipv4: "10.99.1.6/31"
            description: "to dr-ce-1"
            peer: dr-ce-1
            peer_interface: GigabitEthernet3
          - name: port3
            description: "HA heartbeat"
    zones:
      - name: dr-trust
        type: trust
        interfaces:
          - port1
      - name: dr-untrust
        type: untrust
        interfaces:
          - port2
    policies:
      - name: allow-dr-outbound
        source_zone: dr-trust
        destination_zone: dr-untrust
        action: allow
        services:
          - tcp/443
          - tcp/80
          - icmp

agent:
  boundary:
    managed:
      - dc-spine-1
      - dc-spine-2
      - dc-leaf-1
      - dc-leaf-2
      - dc-border-1
      - dc-border-2
      - br-ce-1
      - dr-leaf-1
      - dr-leaf-2
    observed:
      - dc-border-1:external
      - dc-border-2:external
      - dr-leaf-1:external
      - dr-leaf-2:external
    excluded:
      - dc-fw-1
      - dc-fw-2
      - dr-fw-1
      - dr-fw-2
      - dc-ce-1
      - dr-ce-1
      - sp-pe-1
      - sp-pe-2
  thresholds:
    bgp_hold_time: 180
    interface_flap_window_sec: 300
    max_route_deviation_pct: 10.0
  compliance_rules:
    - name: bgp-session-established
      check: "all managed BGP sessions must be in Established state"
      severity: critical
    - name: vtep-reachability
      check: "all VTEP loopbacks must be reachable from all other VTEPs"
      severity: critical
    - name: vni-consistency
      check: "VNI-to-VLAN mappings must match across all sites"
      severity: warning

tests:
  reachability_matrix:
    - source: dc-host-1
      destination: dc-host-2
      description: "East-west inter-VNI through fabric"
    - source: dc-host-1
      destination: br-host-1
      description: "DC to branch full WAN path"
    - source: dc-host-1
      destination: dr-host-1
      description: "DC to DR recovery path"
    - source: br-host-1
      destination: dr-host-1
      description: "Branch to DR cross-site"
